name: commit-unit-tests-workflow

on:
  push:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
        run:
          working-directory: ./backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0'

      - name: Build Backend
        run: dotnet build

      - name: Backend Unit Tests 
        run: dotnet test --filter DisplayName~UnitTests --ignore-exit-code 8 #Ignoring code 8 because we skipped Integration Tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.12.0'

      - name: Install npm dependencies
        run: npm ci
      
      - name: npm Build
        run: npm run build

      - name: Unit Tests
        run: npm run test:unit