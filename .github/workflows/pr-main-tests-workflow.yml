name: commit-unit-tests-workflow

on:
  push:
  # pull_request:
  #   branches:
  #     - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
        run:
          working-directory: ./backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0'

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true' 
        run: |
          mkdir ${{ runner.temp }}\scanner
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Install Dotnet Coverage Tool
      - run: dotnet tool install --global dotnet-coverage

      - name: Begin Sonar Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"hootout_hootoutapi" /o:"hootout" /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Build Backend
        run: dotnet build

      - name: Backend Unit Tests 
        run: dotnet test --filter DisplayName~UnitTests --ignore-exit-code 8

      - name: Backend Integraion and E2E Tests
      - run: dotnet test --filter DisplayName~IntegrationTests --ignore-exit-code 8

      - name: End Sonar Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

