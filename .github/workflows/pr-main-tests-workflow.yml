name: pr-main-tests-workflow

permissions:
  contents: read
  pull-requests: write
  checks: write

on: 
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
        run:
          working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Setup Dotnet 10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0' 

      - name: Install SonarQube Cloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install Dotnet Coverage Tool
        run: dotnet tool install --global dotnet-coverage

      - name: Begin Sonar Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet-sonarscanner begin
          /k:"hootout_hootoutapi"
          /o:"hootout"
          /d:sonar.token="${{ secrets.SONAR_BACKEND_TOKEN }}"
          /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml"

      - name: Build Backend
        run: dotnet build

      - name: Backend Unit and Integration Tests
        run: dotnet-coverage collect "dotnet test" -f xml -o "coverage.xml"

      - name: End Sonar Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_BACKEND_TOKEN }}"
  
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    env:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pwd
      POSTGRES_DB: test_db
      POSTGRES_PORT: 5432
      HOOTOUTAPI_HTTPS_PORTS: 1234 
      HOOTOUTWEBSOCKETS_HTTPS_PORTS: 4321
      RABBIT_HOSTNAME: hootout
      RABBITMQ_USER: rabbit_user
      RABBITMQ_PASSOWRD: rabbit_test_123 
      RUSTFS_PORT: 9000
      RUSTFS_ACCESS_KEY: hootout_s3
      RUSTFS_SECRET_KEY: rustfs_test_123 
      TLS_CERT: ../certs/cert.pem
      TLS_KEY: ../certs/key.pem
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.12.0'

      - name: Install npm dependencies
        run: npm ci  

      - name: Unit Tests
        run: npm run test:unit:coverage

      - name: npm Build
        run: npm run build:test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Create self signed certificate for https connections
        working-directory: .
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 7 \
            -keyout certs/key.pem -out certs/cert.pem \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,DNS:rustfs,DNS:rabbitmq,IP:127.0.0.1"
          cp certs/cert.pem certs/ca.pem   # self-signed: it is its own CA (SSL_CERT_FILE, RabbitMQ cacertfile)
          chmod 644 certs/*.pem

      - name: Docker Compose Backend
        run: docker compose -f ../backend/compose.dev.yaml up -d --build --wait

      - name: Run Playwright tests
        env:
          E2E_COVERAGE: true
          DEBUG: pw:webserver
        run: npm run test:e2e:coverage

      - name: Backend status and logs
        if: always()
        run: |
          docker compose -f ../backend/compose.dev.yaml ps -a
          echo "===== hootoutapi ====="
          docker compose -f ../backend/compose.dev.yaml logs --no-color hootoutapi
          echo "===== ports ====="
          ss -ltnp | grep -E '1234|4321' || echo "nothing listening on 1234/4321"

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            playwright-report/
            monocart-report/
            test-results/

      - name: Upload Playwright reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          retention-days: 5
          path: |
            frontend/playwright-report/
            frontend/monocart-report/
            frontend/test-results/

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=hootout_hootoutfrontend
            -Dsonar.organization=hootout
            -Dsonar.sources=frontend
            -Dsonar.projectName=HootOutFrontend
            -Dsonar.sources=src
            -Dsonar.tests=src,e2e
            -Dsonar.exclusions=**/*.test.ts,**/*.spec.ts,**/__tests__/**,**/mocks/**
            -Dsonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/__tests__/**,e2e/**
            -Dsonar.javascript.lcov.reportPaths=coverage/vitest/lcov.info,coverage/e2e/lcov.info
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_FRONTEND_TOKEN }}  

      - name: Stop containers
        if: always()
        run: docker compose -f ../backend/compose.dev.yaml down