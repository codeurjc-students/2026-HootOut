name: backend_full_tests

on:
  workflow_call:

jobs:
  backend_full_tests:
    runs-on: ubuntu-latest
    defaults:
        run:
          working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Setup Dotnet 10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0' 

      - name: Install SonarQube Cloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install Dotnet Coverage Tool
        run: dotnet tool install --global dotnet-coverage

      - name: Begin Sonar Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet-sonarscanner begin
          /k:"hootout_hootoutapi"
          /o:"hootout"
          /d:sonar.token="${{ secrets.SONAR_BACKEND_TOKEN }}"
          /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml"

      - name: Build Backend
        run: dotnet build

      - name: Backend Unit and Integration Tests
        run: dotnet-coverage collect "dotnet test" -f xml -o "coverage.xml"

      - name: End Sonar Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_BACKEND_TOKEN }}"