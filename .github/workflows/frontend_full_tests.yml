name: frontend_full_tests

on:
  workflow_call:

jobs:
  frontend_full_tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    env:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pwd
      POSTGRES_DB: test_db
      POSTGRES_PORT: 5432
      RABBIT_HOSTNAME: hootout
      RABBITMQ_USER: rabbit_user
      RABBITMQ_PASSWORD: rabbit_test_123 
      RUSTFS_PORT: 9000
      RUSTFS_ACCESS_KEY: hootout_s3
      RUSTFS_SECRET_KEY: rustfs_test_123 
      TLS_CERT: ../certs/cert.pem
      TLS_KEY: ../certs/key.pem
    steps:
      - uses: actions/checkout@v7 
      
      - name: Create self signed certificate for https connections
        working-directory: .
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 7 \
            -keyout certs/key.pem -out certs/cert.pem \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,DNS:rustfs,DNS:rabbitmq,IP:127.0.0.1"
          cp certs/cert.pem certs/ca.pem   # self-signed: it is its own CA (SSL_CERT_FILE, RabbitMQ cacertfile)
          chmod 644 certs/*.pem

      - name: Create haproxy certificate
        working-directory: .
        run: cat certs/cert.pem certs/key.pem > certs/hootout.pem

      - name: Prepare backend keys folder
        working-directory: ./backend
        run: |
          mkdir -p keys
          chmod 777 keys

      - name: Docker Compose Backend
        run: docker compose -f ../backend/compose.test.yaml up -d --build

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci  

      - name: Unit Tests
        run: npm run test:unit:coverage

      - name: npm Build
        run: npm run build:test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -sk -o /dev/null https://localhost:1234/; then
              echo "API up"; exit 0
            fi
            sleep 2
          done
          echo "API not reachable on :1234"
          docker compose -f ../backend/compose.dev.yaml ps -a
          docker compose -f ../backend/compose.dev.yaml logs --no-color hootoutapi
          exit 1

      - name: Run Playwright tests
        env:
          E2E_COVERAGE: true
          DEBUG: pw:webserver
        run: npm run test:e2e:coverage

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          retention-days: 5
          path: |
            frontend/playwright-report/
            frontend/monocart-report/
            frontend/test-results/

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=hootout_hootoutfrontend
            -Dsonar.organization=hootout
            -Dsonar.sources=frontend
            -Dsonar.projectName=HootOutFrontend
            -Dsonar.sources=src
            -Dsonar.tests=src,e2e
            -Dsonar.exclusions=**/*.test.ts,**/*.spec.ts,**/__tests__/**,**/mocks/**
            -Dsonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/__tests__/**,e2e/**
            -Dsonar.javascript.lcov.reportPaths=coverage/vitest/lcov.info,coverage/e2e/lcov.info
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_FRONTEND_TOKEN }}  

      - name: Stop containers
        if: always()
        run: docker compose -f ../backend/compose.test.yaml down