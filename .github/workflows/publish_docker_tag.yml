name: publish_docker_tag

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string 

jobs:
  publish_docker:
    runs-on: ubuntu-latest 
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate API Project Docker image
        run: docker build -f docker/ApiDockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/hootout_api:${{ inputs.tag }} .

      - name: Generate Websockets Project Docker image
        run: docker build -f docker/WsDockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/hootout_websockets:${{ inputs.tag }} ./backend

      - name: Login to Dockerhub
        run: docker login
          -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"
      
      - name: Push API image to DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/hootout_api:${{ inputs.tag }}
      
      - name: Push Websockets image to DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/hootout_websockets:${{ inputs.tag }}

      - name: Publish dev Docker compose file 
        run: docker compose -f docker/compose.dev.yaml --env-file docker/.env.example -y publish ${{ secrets.DOCKERHUB_USERNAME }}/hootout-compose:${{ inputs.tag }}