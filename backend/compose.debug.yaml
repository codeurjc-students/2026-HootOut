# Please refer https://aka.ms/HTTPSinContainer on how to setup an https developer certificate for your ASP.NET Core service.

services:
  hootoutapi:
    image: hootoutapi
    build:
      context: .
      dockerfile: HootOutAPI/Dockerfile
      args:
        - configuration=Debug
    ports:
      - 8080:8080
      - 8081:8081
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ~/.vsdbg:/remote_debugger:rw
  hootoutwebsockets:
    image: hoothutwebsockets
    build:
      context: .
      dockerfile: HootOutWebsockets/Dockerfile
      args:
        - configuration=Debug
    ports:
      - 80:80
      - 81:81
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ~/.vsdbg:/remote_debugger:rw
